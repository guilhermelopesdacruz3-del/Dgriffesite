# Banco PostgreSQL local (Docker) — `docker compose up -d`
# Para produção, use Neon ou Supabase e troque a DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    container_name: otica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: otica
    ports:
      - "5432:5432"
    volumes:
      - otica_dbdata:/var/lib/postgresql/data

volumes:
  otica_dbdata:
